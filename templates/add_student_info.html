<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add / Update Student Info</title>
    <style>
        body {
            background: linear-gradient(to right, #0a3d62, #3c6382);
            color: white;
            font-family: Arial;
            margin: 0;
        }
        .container {
            width: 50%;
            margin: auto;
            background: rgba(255,255,255,0.15);
            margin-top: 50px;
            padding: 30px;
            border-radius: 12px;
            backdrop-filter: blur(6px);
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 16px;
            background: #38ada9;
            border: none;
            color: white;
            border-radius: 6px;
        }
        button:hover { background: #78e08f; }
        a { color: white; }
    </style>
</head>

<body>

<div class="container">
    <h2>{{ student and 'Edit Resume' or 'Add Resume' }}</h2>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" value="{{ student[1] if student else '' }}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ student[2] if student else '' }}" required>

        <label>Desired Position</label>
        <input type="text" name="desired_position" value="{{ student[3] if student else '' }}">

        <label>Desired Company</label>
        <input type="text" name="desired_company" value="{{ student[4] if student else '' }}">

        <label>Branch</label>
        <input type="text" name="branch" value="{{ student[5] if student else '' }}">

        <label>GPA</label>
        <input type="number" step="0.1" name="gpa" value="{{ student[6] if student else '' }}">

        <label>Skills (comma separated)</label>
        <input type="text" name="skills" value="{{ student[7] if student else '' }}">

        <button type="submit">Save</button>
    </form>

    <br>
    <a href="{{ url_for('student_dashboard') }}">← Back</a>
</div>

</body>
</html>
