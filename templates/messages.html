<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Messages</title>
    <style>
        body { background: linear-gradient(to right,#0a3d62,#3c6382); color:white; font-family:Arial; }
        .container { width:70%; margin:auto; padding:30px; }

        .box {
            background:rgba(255,255,255,0.15);
            padding:20px; border-radius:10px;
            margin-bottom:25px; backdrop-filter:blur(5px);
        }

        input, textarea, select {
            width:100%; padding:12px; border-radius:6px;
            border:none; margin-top:10px;
        }

        button {
            padding:10px 16px; background:#38ada9;
            border:none; border-radius:6px; color:white;
            margin-top:10px;
        }
        button:hover { background:#78e08f; }

        .msg {
            padding:12px; margin-bottom:10px;
            background:rgba(255,255,255,0.2);
            border-radius:8px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Messages</h1>

    <div class="box">
        <h3>Send Message</h3>

        <form method="POST">
            <label>Receiver Email</label>
            <input type="email" name="receiver_email" required>

            <label>Message</label>
            <textarea name="message" rows="3" required></textarea>

            <button type="submit">Send</button>
        </form>
    </div>

    <div class="box">
        <h3>Inbox</h3>

        {% for m in messages %}
        <div class="msg">
            <strong>From:</strong> {{ m[0] }}<br>
            {{ m[1] }}<br>
            <small>{{ m[2] }}</small>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
