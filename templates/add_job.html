<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Job - Recruiter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0a3d62, #3c6382);
            margin: 0;
            padding: 0;
            color: #fff;
        }
        .container {
            width: 420px;
            margin: 50px auto;
            padding: 25px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            backdrop-filter: blur(6px);
        }
        h2 { text-align: center; margin-bottom: 20px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #1e90ff;
            color: white;
            font-size: 16px;
            border-radius: 8px;
        }
        button:hover { background: #0a79d1; }
        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #fff;
            text-decoration: none;
        }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Add New Job</h2>

    <form method="POST">
        <label>Select Company</label>
        <select name="recruiter_id" required>
            {% for rec in recruiters %}
            <option value="{{ rec[0] }}">{{ rec[1] }}</option>
            {% endfor %}
        </select>

        <label>Job Position</label>
        <input type="text" name="position" required>

        <label>Minimum GPA</label>
        <input type="number" step="0.1" name="min_gpa" required>

        <label>Required Skills</label>
        <textarea name="required_skills" required></textarea>

        <button type="submit">Save Job</button>
    </form>

    <a class="back" href="/recruiter">← Back</a>
</div>

</body>
</html>
