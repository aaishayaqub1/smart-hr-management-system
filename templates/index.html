<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart HR Management System</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #004AAD, #00C2FF);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .login-container {
            width: 380px;
            background: rgba(255, 255, 255, 0.18);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }

        h3 {
            font-weight: 400;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        label {
            display: block;
            text-align: left;
            font-size: 15px;
            margin-top: 10px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #062863;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #02183A;
        }

        .error-box {
            background: #ff4d4d;
            padding: 10px;
            bordeR-radius: 8px;
            margin-bottom: 15px;
            color: white;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>Smart HR Management System</h1>
        <h3>Secure Login Portal</h3>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form action="/" method="POST">

            <label>Select Role</label>
            <select name="role" required>
                <option value="student">Student</option>
                <option value="hr">HR</option>
                <option value="recruiter">Recruiter</option>
            </select>

            <label>Username</label>
            <input type="text" name="username" placeholder="Enter Username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
